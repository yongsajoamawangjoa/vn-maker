<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>미연시 장면 에디터</title>
<style>
:root{--bg:#e9eef2;--card:#fff;--ink:#1d2b36;--mute:#71808c;--line:#cfd8df;--acc:#1f7a8c;--ok:#3a9a5b;--hd:#dcebef}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:14px/1.4 "Pretendard","Malgun Gothic",system-ui,sans-serif;color:var(--ink)}
#bar{position:fixed;inset:0 0 auto 0;height:50px;display:flex;gap:8px;align-items:center;padding:0 14px;background:var(--card);border-bottom:1px solid var(--line);z-index:5}
#bar b{font-size:15px;margin-right:6px}#bar small{color:var(--mute);margin-left:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#bar button,#bar label{flex:none;white-space:nowrap}
button{font:inherit;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 11px;cursor:pointer;color:var(--ink)}

button.main{background:var(--acc);border-color:var(--acc);color:#fff}
#view{position:absolute;inset:50px 0 0 230px;overflow:hidden;cursor:grab;background:var(--bg) radial-gradient(#c3cdd5 1px,transparent 1px) 0 0/24px 24px}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#svg path{fill:none;stroke:var(--acc);stroke-width:2.5}
.n{position:absolute;width:264px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 6px #0d1f2d1a;cursor:default}
.n.start{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.b .cont{background:var(--hd);border-color:var(--acc);color:var(--acc);font-weight:600}
.n.end{border-color:#2b2a33}.n.end .h{background:#2b2a33;color:#fff}.n.end .nm:not([readonly]){color:var(--ink)}
.h{position:relative;display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--hd);border-radius:7px 7px 0 0;cursor:move;font-weight:600}
.n.start .h{background:#d9efe0}.tt{flex:1}.h button{padding:1px 7px;font-size:12px}
.b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:5px}
.b>label{font-size:12px;color:var(--mute);margin-top:3px}
.dz{border:1.5px dashed var(--line);border-radius:6px;padding:6px;text-align:center;color:var(--mute);font-size:12px;cursor:pointer;min-height:38px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.dz.over{border-color:var(--acc);background:#1f7a8c14}.dz img{height:52px;border-radius:4px;display:block}
.th{position:relative;display:inline-block}.th i{position:absolute;right:-5px;top:-5px;background:#c0392b;color:#fff;border-radius:50%;width:16px;height:16px;font-size:12px;line-height:16px;font-style:normal;cursor:pointer}
input[type=text],textarea{width:100%;font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:56px}
.c{position:relative;display:flex;gap:4px;align-items:center}.c.nx{justify-content:flex-end;color:var(--mute);font-size:12px;padding:2px 0}
.pt{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
.ip{left:-8px;top:10px}.c .pt{right:-18px;top:50%;margin-top:-7px;cursor:crosshair}.c .pt:hover{background:var(--acc)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2b36;color:#fff;padding:9px 14px;border-radius:8px;display:flex;gap:12px;align-items:center;z-index:9}.toast button{padding:2px 9px}
.pn{position:fixed;inset:0;background:#0d1f2d8c;display:flex;align-items:center;justify-content:center;z-index:8}
.pb{width:min(640px,92vw);background:#fff;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pb textarea{height:46vh;font:12px/1.4 ui-monospace,Consolas,monospace}.row{display:flex;gap:8px;justify-content:flex-end}
#side{position:fixed;left:0;top:50px;bottom:0;width:230px;background:var(--card);border-right:1px solid var(--line);z-index:4;display:flex;flex-direction:column;gap:8px;padding:10px;overflow:auto}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px}.tabs button{padding:5px 2px;font-size:12px}
.ul{font-size:12px;color:var(--mute);margin-top:2px}.fp{font:400 20px/1.2 vnUserFont,sans-serif;color:var(--ink)}
.li.au{cursor:default}.li.au button:first-child{width:28px}
.b>select{width:100%;flex:none}.tabs .on{background:var(--hd);border-color:var(--acc);font-weight:600}
.lib{display:flex;flex-direction:column;gap:6px}.lib small{color:var(--mute)}
.li{display:flex;align-items:center;gap:8px;padding:4px;border:1px solid var(--line);border-radius:6px;cursor:grab}
.li img{height:40px;width:40px;object-fit:contain;background:#eef2f5;border-radius:4px}
.li span{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li button{padding:0 6px}
.nm{flex:1;min-width:0;font:inherit;font-weight:600;border:1px solid transparent;background:transparent;color:inherit;border-radius:4px;padding:1px 4px;cursor:move}
.nm:not([readonly]){background:#fff;border-color:var(--acc);cursor:text}
.hit{stroke:transparent!important;stroke-width:16!important;pointer-events:stroke;cursor:pointer}
.ed{position:absolute;z-index:3;background:#c0392b;color:#fff;border-color:#c0392b}
.pan,.pan *{user-select:none;-webkit-user-select:none}
.pk{display:flex;flex-wrap:wrap;gap:8px;max-height:46vh;overflow:auto}
.pk div{cursor:pointer;font-size:11px;width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk img{width:84px;height:64px;object-fit:contain;background:#eef2f5;border-radius:4px;display:block}
.cc{border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px}
.ch{display:flex;align-items:center;gap:4px;cursor:grab}.ch button{padding:0 6px}.chn[readonly]{pointer-events:none}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px}.pg small{grid-column:1/-1;color:var(--mute)}
.po{position:relative;cursor:grab;display:flex;flex-direction:column;gap:2px;min-width:0}
.po img{width:100%;height:56px;object-fit:contain;background:#eef2f5;border-radius:4px}
.po span{font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;color:var(--mute)}
.po i{position:absolute;right:-4px;top:-4px;background:#c0392b;color:#fff;border-radius:50%;width:16px;height:16px;font-size:12px;line-height:16px;text-align:center;font-style:normal;cursor:pointer}
.cr{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px}.cr button{padding:0 6px}
.ce{flex:1;display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.ce img{height:44px;width:44px;object-fit:contain;background:#eef2f5;border-radius:4px}
.ce span{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button:disabled{opacity:.35;cursor:default}button:disabled:hover{border-color:var(--line)}
.cr.v{flex-direction:column;align-items:stretch}.crt{display:flex;gap:6px;align-items:center}
.em{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
select{font:inherit;flex:1;min-width:0;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
</style></head><body>
<div id="bar"><b>미연시 장면 에디터</b>
<button class="main" id="add">+ 장면 추가</button><button id="addEnd">+ 엔딩 추가</button><button id="sv">프로젝트 저장</button><button id="ld">불러오기</button>
<button class="main" id="pl">▶ 바로 플레이</button><button id="dist">배포용 파일 만들기</button><button id="ex">게임용 내보내기</button><label><input type="checkbox" id="inc"> 파일 포함 (이미지, 오디오, 폰트)</label>
<small>빈 곳 더블클릭: 장면 추가 · 장면 이름 더블클릭: 이름 변경 · 연결선 클릭: 삭제 · 휠: 확대/축소</small>
<input type="file" id="file" accept=".json" hidden></div>
<div id="side"></div>
<div id="view"><div id="world"><svg id="svg"></svg></div></div>
<script>
const $=s=>document.querySelector(s),view=$('#view'),world=$('#world'),svg=$('#svg');
let S,pan={x:40,y:40},z=1,D=null;
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a)x=='c'?e.className=a[x]:x.startsWith('on')?e[x]=a[x]:e.setAttribute(x,a[x]);e.append(...k);return e};
const getL=(n,k)=>k=='n'?n.next:n.choices[k].next, setL=(n,k,v)=>{if(k=='n')n.next=v;else n.choices[k].next=v};
let st,tab='c';
const save=()=>{clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem('vnEditor',JSON.stringify({...S,images:null,audio:null,uiAssets:null}))}catch(e){}},400)};
const idb=(mode,fn)=>new Promise(res=>{try{const r=indexedDB.open('vn-editor',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');
 r.onsuccess=()=>{try{const tx=r.result.transaction('kv',mode),q=fn(tx.objectStore('kv'));tx.oncomplete=()=>res(q.result);tx.onerror=tx.onabort=()=>res(null)}catch(e){res(null)}};r.onerror=()=>res(null)}catch(e){res(null)}});
const saveImgs=()=>idb('readwrite',s=>s.put({images:S.images,audio:S.audio,uiAssets:S.uiAssets},'assets')).then(r=>{if(r==null)toast('이미지와 오디오를 브라우저에 자동 저장하지 못했어요. "프로젝트 저장"을 사용해 주세요.')});
const uname=b=>{let s=b;while(S.nodes.some(m=>m.name==s))s+='*';return s};
const ucast=b=>{let s=b;while(Object.values(S.cast).some(c=>c.name==s))s+='*';return s};
function norm(){S.images=S.images||{};S.cast=S.cast||{};S.cseq=S.cseq||1;S.audio=S.audio||{};S.uiAssets=S.uiAssets||{};S.title=S.title||'';S.aseq=S.aseq||1;
 S.nodes.forEach(n=>{n.name=n.name||'장면 '+n.id.slice(1);n.bgm=n.bgm=='__stop__'||S.audio[n.bgm]?n.bgm:'';n.se=S.audio[n.se]?n.se:''});
 Object.entries(S.images).forEach(([id,i])=>{if(!i.kind)i.kind=S.nodes.some(n=>n.bg==id)?'b':'c';
  if(i.kind=='c'&&!(i.char&&S.cast[i.char])){const cid='c'+S.cseq++;i.char=cid;S.cast[cid]={id:cid,name:ucast(i.name.replace(/\.[^.]+$/,''))}}});
 S.nodes.forEach(n=>{n.chars=(n.chars||[]).map(x=>typeof x=='string'?{c:S.images[x]?.char,p:x}:x).filter(x=>x.c&&S.cast[x.c]&&S.images[x.p]).map(x=>({...x,e:x.e||'none'}))})}
function restore(s){const o=JSON.parse(s);o.images=o.images||S.images;o.audio=o.audio||S.audio;o.uiAssets=o.uiAssets||S.uiAssets;S=o;saveImgs();save();render();side()}
const mkThumb=src=>new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,120/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/png'))};im.onerror=()=>res(src);im.src=src});
function addImgs(files,kind,cid){const fs=[...files].filter(f=>f.type.startsWith('image/'));if(!fs.length)return toast('이미지 파일만 추가할 수 있어요.');let dup=0;
 Promise.all(fs.map(f=>{if(Object.values(S.images).some(i=>i.kind==kind&&i.char==cid&&i.name==f.name)){dup++;return null}
  return new Promise(res=>{const r=new FileReader();r.onload=()=>mkThumb(r.result).then(th=>{const id='i'+S.iseq++;S.images[id]={kind,char:cid,name:f.name,data:r.result,thumb:th};res(id)});r.readAsDataURL(f)})}))
 .then(()=>{saveImgs();save();side();if(dup)toast(dup+'장은 같은 이름이 이미 있어 건너뛰었어요.')})}
let op={};
const poses=cid=>Object.entries(S.images).filter(([,i])=>i.kind=='c'&&i.char==cid);
const upl=(label,cb,acc='image/*')=>{const up=h('div',{c:'dz'},label);up.ondragover=e=>{e.preventDefault();up.classList.add('over')};up.ondragleave=()=>up.classList.remove('over');
 up.ondrop=e=>{e.preventDefault();up.classList.remove('over');cb(e.dataTransfer.files)};
 up.onclick=()=>{const f=h('input',{type:'file',accept:acc});f.multiple=true;f.onchange=()=>cb(f.files);f.click()};return up};
function delPose(id){const s=JSON.stringify(S),cid=S.images[id].char;delete S.images[id];const rest=poses(cid);
 S.nodes.forEach(n=>{n.chars=n.chars.filter(x=>{if(x.p!=id)return true;if(!rest.length)return false;x.p=rest[0][0];return true})});
 saveImgs();save();render();side();toast('포즈를 삭제했어요.',()=>restore(s))}
function delChar(c){const s=JSON.stringify(S);poses(c.id).forEach(([id])=>delete S.images[id]);delete S.cast[c.id];
 S.nodes.forEach(n=>{n.chars=n.chars.filter(x=>x.c!=c.id)});saveImgs();save();render();side();toast('캐릭터를 삭제했어요. 쓰던 장면에서도 빠집니다.',()=>restore(s))}
function side(){const el=$('#side');el.innerHTML='';
 const nc=Object.keys(S.cast).length,nb=Object.values(S.images).filter(i=>i.kind=='b').length,tabs=h('div',{c:'tabs'});
 [['c',`캐릭터 (${nc})`],['b',`배경 (${nb})`],['a',`오디오 (${Object.keys(S.audio).length})`],['u','UI']].forEach(([k,l])=>{const b=h('button',{c:k==tab?'on':''},l);b.onclick=()=>{tab=k;side()};tabs.append(b)});
 el.append(tabs);({b:sideBg,a:sideAudio,u:sideUi}[tab]||sideCast)(el)}
let prevA=null,prevId=null;
function addAudio(files){const fs=[...files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|ogg|wav|m4a|aac|flac|opus)$/i.test(f.name));if(!fs.length)return toast('오디오 파일만 추가할 수 있어요.');let dup=0;
 Promise.all(fs.map(f=>{if(Object.values(S.audio).some(a=>a.name==f.name)){dup++;return null}
  return new Promise(res=>{const r=new FileReader();r.onload=()=>{const id='a'+S.aseq++;S.audio[id]={name:f.name,data:r.result};res(id)};r.readAsDataURL(f)})}))
 .then(()=>{saveImgs();save();side();render();if(dup)toast(dup+'개는 같은 이름이 이미 있어 건너뛰었어요.')})}
function preview(id){if(prevA){prevA.pause();prevA=null}if(prevId==id){prevId=null;side();return}
 prevId=id;prevA=new Audio(S.audio[id].data);prevA.onended=()=>{prevId=null;prevA=null;if(tab=='a')side()};
 prevA.play().catch(()=>{prevId=null;prevA=null;toast('이 브라우저에서는 이 오디오를 재생할 수 없어요.');side()});side()}
function sideAudio(el){const list=h('div',{c:'lib'});
 Object.entries(S.audio).forEach(([id,a])=>{const pl=h('button',{title:prevId==id?'멈추기':'미리 듣기'},prevId==id?'■':'▶'),x=h('button',{title:'삭제'},'×');
  pl.onclick=()=>preview(id);
  x.onclick=()=>{if(prevId==id)preview(id);const s=JSON.stringify(S);delete S.audio[id];S.nodes.forEach(n=>{if(n.bgm==id)n.bgm='';if(n.se==id)n.se=''});saveImgs();save();render();side();toast('오디오를 삭제했어요. 쓰던 장면에서도 빠집니다.',()=>restore(s))};
  list.append(h('div',{c:'li au',title:a.name},pl,h('span',{},a.name),x))});
 if(!list.children.length)list.append(h('small',{},'아직 오디오가 없어요. 배경음과 효과음 파일을 여기에 추가하세요.'));
 el.append(upl('+ 오디오 추가 (끌어다 놓기 · 클릭)',addAudio,'audio/*'),list)}
const UIS=[['titleImage','타이틀 배경','1920×1080 권장'],['titleLogo','타이틀 로고','투명 배경 PNG 권장'],['textBox','대사창','5:1 비율, 1600×320 권장'],['nameBox','이름표','5:1 비율, 360×72 권장'],['choiceButton','선택지 버튼','1040×100 권장'],['endImage','엔딩 배경','1920×1080 권장'],['font','폰트','ttf, otf, woff']];
function setUi(k,f){if(!f)return;const isFont=k=='font';
 if(!isFont&&!f.type.startsWith('image/'))return toast('이미지 파일만 넣을 수 있어요.');
 if(isFont&&!/\.(ttf|otf|woff2?)$/i.test(f.name))return toast('ttf, otf, woff, woff2 폰트 파일만 넣을 수 있어요.');
 const r=new FileReader();r.onload=()=>{const done=th=>{S.uiAssets[k]={name:f.name,data:r.result,thumb:th};saveImgs();save();side()};isFont?done(null):mkThumb(r.result).then(done)};r.readAsDataURL(f)}
let fontKey='';
function loadFontPreview(){const f=S.uiAssets.font;if(!f||fontKey==f.name+f.data.length)return;fontKey=f.name+f.data.length;
 try{new FontFace('vnUserFont',`url(${f.data})`).load().then(x=>document.fonts.add(x)).catch(()=>toast('폰트 파일을 읽지 못했어요.'))}catch(e){}}
function sideUi(el){const ti=h('input',{type:'text',placeholder:'타이틀 화면에 보일 제목',value:S.title||''});ti.oninput=()=>{S.title=ti.value;save()};
 el.append(h('small',{c:'ul'},'비워 둔 항목은 플레이어의 기본 모양을 써요.'),h('label',{c:'ul'},'작품 제목'),ti);
 UIS.forEach(([k,label,hint])=>{const a=S.uiAssets[k],isFont=k=='font';
  const d=upl(a?a.name:'끌어다 놓기 · 클릭 ('+hint+')',f=>setUi(k,f[0]),isFont?'.ttf,.otf,.woff,.woff2':'image/*');
  if(a){const x=h('i',{},'×');x.onclick=e=>{e.stopPropagation();const s=JSON.stringify(S);S.uiAssets[k]=null;saveImgs();save();side();toast(label+' 설정을 지웠어요.',()=>restore(s))};
   d.prepend(h('span',{c:'th'},isFont?h('b',{c:'fp'},'가나다 Aa'):h('img',{src:a.thumb||a.data}),x))}
  el.append(h('label',{c:'ul'},label),d)});
 loadFontPreview()}
function aSel(n,k,opts){const s=h('select',{},...opts.map(([v,l])=>h('option',{value:v},l)),...Object.entries(S.audio).map(([id,a])=>h('option',{value:id},a.name)));
 s.value=n[k]||'';s.onchange=()=>{n[k]=s.value;save()};return s}
function sideBg(el){const list=h('div',{c:'lib'});
 Object.entries(S.images).filter(([,i])=>i.kind=='b').forEach(([id,i])=>{const x=h('button',{title:'삭제'},'×'),it=h('div',{c:'li',draggable:'true',title:i.name},h('img',{src:i.thumb||i.data}),h('span',{},i.name),x);
  it.ondragstart=e=>e.dataTransfer.setData('text/plain','vn:b:'+id);
  x.onclick=()=>{const s=JSON.stringify(S);delete S.images[id];S.nodes.forEach(n=>{if(n.bg==id)n.bg=null});saveImgs();save();render();side();toast('이미지를 삭제했어요. 쓰던 장면에서도 빠집니다.',()=>restore(s))};list.append(it)});
 if(!list.children.length)list.append(h('small',{},'아직 이미지가 없어요.'));
 el.append(upl('+ 배경 이미지 추가 (끌어다 놓기 · 클릭)',f=>addImgs(f,'b')),list)}
function sideCast(el){const ab=h('button',{c:'main'},'+ 캐릭터 추가'),list=h('div',{c:'lib'});
 ab.onclick=()=>{const id='c'+S.cseq++;S.cast[id]={id,name:ucast('캐릭터 '+id.slice(1))};op[id]=true;save();side()};
 Object.values(S.cast).forEach(c=>{const ps=poses(c.id),isO=op[c.id]!==false,tg=h('button',{},isO?'▾':'▸'),x=h('button',{title:'캐릭터 삭제'},'×'),

$('#ld').onclick=()=>panel('프로젝트 불러오기','',{pick:1,okLabel:'붙여넣은 내용 불러오기',ok:importText});
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;f.text().then(t=>{if(importText(t))document.querySelector('.pn')?.remove()})};
function buildExport(inc){const nm=id=>id?S.images[id]?.name:null;
 const img=i=>inc?{name:i.name,data:i.data}:{name:i.name};
 const o={title:S.title||'',start:S.start,ui:Object.fromEntries(UIS.map(([k])=>[k,S.uiAssets[k]?img(S.uiAssets[k]):null])),audio:Object.values(S.audio).map(a=>img(a)),characters:Object.values(S.cast).map(c=>({name:c.name,poses:poses(c.id).map(([,i])=>img(i))})),backgrounds:Object.values(S.images).filter(i=>i.kind=='b').map(i=>img(i)),nodes:S.nodes.map(n=>({id:n.id,name:n.name,type:n.type==='end'?'ending':'scene',endMessage:n.type==='end'?(n.endMsg||''):'',background:nm(n.bg),characters:n.chars.map(x=>({character:S.cast[x.c].name,pose:S.images[x.p].name,emphasis:x.e||'none'})),bgmAction:n.bgm=='__stop__'?'stop':n.bgm?'play':'keep',bgm:n.bgm&&n.bgm!='__stop__'?(S.audio[n.bgm]?.name||''):'',se:n.se?(S.audio[n.se]?.name||''):'',speaker:n.speaker,text:n.text,next:n.choices.length?null:n.next,choices:n.choices.map(c=>({text:c.text,next:c.next}))}))};
 return o}
$('#ex').onclick=()=>{if(!S.nodes.length)return toast('내보낼 장면이 없습니다.');panel('게임용 JSON (Unity에서 읽는 파일)',JSON.stringify(buildExport($('#inc').checked),null,2),{file:'story.json'})};

/* ── 바로 플레이 / 배포용 파일 ── 에디터와 같은 폴더에 플레이어 파일이 있어야 합니다 */
const PLAYER_URL='vn-player.html';
let previewWin=null,previewPayload=null;
addEventListener('message',e=>{if(!previewWin||e.source!==previewWin||!e.data||e.data.type!=='vn-player-ready'||!previewPayload)return;
 try{previewWin.postMessage(previewPayload,'*')}catch(x){toast('플레이어 창에 이야기를 보내지 못했어요.')}});
$('#pl').onclick=()=>{if(!S.nodes.length)return toast('플레이할 장면이 없습니다.');
 previewPayload={type:'vn-story',story:buildExport(true),title:''};
 previewWin=window.open(PLAYER_URL+'?preview='+Date.now()+'#preview','vnPreview');
 if(!previewWin)return toast('새 창이 막혔어요. 브라우저에서 이 사이트의 팝업을 허용해 주세요.');
 try{previewWin.focus()}catch(x){}};
$('#dist').onclick=async()=>{if(!S.nodes.length)return toast('배포할 장면이 없습니다.');
 let html;
 try{const r=await fetch(PLAYER_URL,{cache:'no-cache'});if(!r.ok)throw 0;html=await r.text()}
 catch(x){return toast('플레이어 파일('+PLAYER_URL+')을 불러오지 못했어요. 두 파일을 같은 폴더에 두고 웹 서버에서 열어 주세요.')}
 const at=html.indexOf('<script>');
 if(at<0||html.includes('id="vn-embedded-story"'))return toast('플레이어 파일 형식이 예상과 달라요. 원본 '+PLAYER_URL+'을 써 주세요.');
 const json=JSON.stringify(buildExport(true)).replace(/</g,'\\u003c');
 const out=html.slice(0,at)+'<script id="vn-embedded-story" type="application/json">'+json+'<\/script>\n'+html.slice(at);
 const name=(S.title||'').trim().replace(/[\\/:*?"<>|]/g,'').slice(0,60)||'my-visual-novel';
 dl(name+'.html',out,'text/html');
 toast('배포용 파일을 만들었어요. 이 파일 하나만 보내면 누구나 바로 플레이할 수 있어요.')};
try{S=JSON.parse(localStorage.getItem('vnEditor'))}catch(e){}
idb('readonly',s=>s.get('assets')).then(a=>{
 if(S&&S.nodes){
  if(a){S.images=a.images||{};S.audio=a.audio||{};S.uiAssets=a.uiAssets||{}}
  else{try{S.images=JSON.parse(localStorage.getItem('vnEditorImg'))||{}}catch(e){S.images={}}}
  norm();render();if(!a&&Object.keys(S.images).length)saveImgs()}
 else{S={nodes:[],images:{},cast:{},audio:{},uiAssets:{},title:'',start:null,seq:1,iseq:1,cseq:1,aseq:1};add(60,60)}
 apply();side()});
</script></body></html>
